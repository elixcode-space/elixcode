[package]
name = "elixcode"
version = "0.1.0"
edition = "2021"
authors = ["Elixcode"]
description = "Elixcode user CLI — OpenCode/Cursor/Claude Code-style AI coding agent"
license = "MIT"
repository = "https://github.com/elixcode-space/elixcode"

[[bin]]
name = "elixcode"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
colored = "2.1"
dirs = "5.0"
rustyline = "14.0"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
jsonwebtoken = "9.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1.5"
regex = "1.10"
walkdir = "2.5"
syntect = "5.2"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
