name: Rust CLI Release

on:
  push:
    tags: ["rust-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/elixcode release/
          tar -czf elixcode-x86_64-unknown-linux-gnu.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elixcode-x86_64-unknown-linux-gnu
          path: elixcode-x86_64-unknown-linux-gnu.tar.gz

  build-linux-arm:
    name: Build (Linux ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --release --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/elixcode release/
          tar -czf elixcode-aarch64-unknown-linux-gnu.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elixcode-aarch64-unknown-linux-gnu
          path: elixcode-aarch64-unknown-linux-gnu.tar.gz

  build-macos-x86:
    name: Build (macOS Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/elixcode release/
          tar -czf elixcode-x86_64-apple-darwin.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elixcode-x86_64-apple-darwin
          path: elixcode-x86_64-apple-darwin.tar.gz

  build-macos-arm:
    name: Build (macOS ARM)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/elixcode release/
          tar -czf elixcode-aarch64-apple-darwin.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elixcode-aarch64-apple-darwin
          path: elixcode-aarch64-apple-darwin.tar.gz

  release:
    needs: [build-linux-x86, build-linux-arm, build-macos-x86, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/elixcode-x86_64-unknown-linux-gnu.tar.gz
            artifacts/elixcode-aarch64-unknown-linux-gnu.tar.gz
            artifacts/elixcode-x86_64-apple-darwin.tar.gz
            artifacts/elixcode-aarch64-apple-darwin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}