name: Rust CLI Release

on:
  push:
    tags: ["rust-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: elixcode-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: elixcode-aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: elixcode-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: elixcode-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cargo build --release --target ${{ matrix.target }}
          fi
          if [[ "${{ matrix.os }}" == "macos-13" ]]; then
            cargo build --release --target ${{ matrix.target }}
          fi
          if [[ "${{ matrix.os }}" == "macos-14" ]]; then
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            target_dir="target/${{ matrix.target }}/release"
          else
            target_dir="target/release"
          fi
          mkdir -p release
          cp $target_dir/elixcode release/
          tar -czf ${{ matrix.artifact }}.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          case: preserve-input-pattern

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/elixcode-x86_64-apple-darwin.tar.gz
            artifacts/elixcode-aarch64-apple-darwin.tar.gz
            artifacts/elixcode-x86_64-unknown-linux-gnu.tar.gz
            artifacts/elixcode-aarch64-unknown-linux-gnu.tar.gz
            artifacts/elixcode-x86_64-pc-windows-msvc.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}