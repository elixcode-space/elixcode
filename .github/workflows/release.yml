name: Rust CLI Release

on:
  push:
    branches: [main]
    tags: ["rust-v*"]
    paths:
      - "**"
      - ".github/workflows/release.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-release
        run: cargo install cargo-release
      - name: Publish to crates.io
        run: |
          cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo release publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Build release binary
        run: |
          cargo build --release
          ls -la target/release/elixcode
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/elixcode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}