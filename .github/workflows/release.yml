name: Rust CLI Release

on:
  push:
    tags: ["rust-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (Linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: elixcode-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            artifact: elixcode-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            cargo build --release
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            target_dir="target/release"
          else
            target_dir="target/${{ matrix.target }}/release"
          fi
          mkdir -p release
          cp $target_dir/elixcode release/
          tar -czf ${{ matrix.artifact }}.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  build-macos-x86:
    name: Build (macOS Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/elixcode release/
          tar -czf elixcode-x86_64-apple-darwin.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elixcode-x86_64-apple-darwin
          path: elixcode-x86_64-apple-darwin.tar.gz

  build-macos-arm:
    name: Build (macOS ARM)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/elixcode release/
          tar -czf elixcode-aarch64-apple-darwin.tar.gz -C release elixcode
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elixcode-aarch64-apple-darwin
          path: elixcode-aarch64-apple-darwin.tar.gz

  release:
    needs: [build-linux, build-macos-x86, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/elixcode-x86_64-unknown-linux-gnu.tar.gz
            artifacts/elixcode-aarch64-unknown-linux-gnu.tar.gz
            artifacts/elixcode-x86_64-apple-darwin.tar.gz
            artifacts/elixcode-aarch64-apple-darwin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}